<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentCar - Bienvenido</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenedor central (ya no necesita ser un enlace obligatorio, pero mantiene el diseño) */
        .splash-container {
            text-decoration: none;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Texto central con la marca RentCar */
        .brand-text {
            font-family: 'Bangers', cursive;
            font-size: 100px;
            color: #df0000;
            font-style: italic;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            animation: pulse 1.5s infinite ease-in-out;
            text-shadow: 3px 3px 0px #000000;
        }

        /* Modificador específico para la letra T en negro */
        .t-black {
            color: #000000;
            text-shadow: 3px 3px 0px #ffffff;
            border-color: #ffffff;
        }

        /* Animación sutil de pulso opcional para darle dinamismo */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Responsivo para pantallas de celulares */
        @media (max-width: 768px) {
            .brand-text {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <h1 class="brand-text">
            REN<span class="t-black">T</span>CAR
        </h1>
    </div>

    <script>
        // Redirige automáticamente a antesdellogin.html después de 3 segundos (3000 milisegundos)
        setTimeout(function() {
            window.location.href = 'antesdellogin.html';
        }, 3000);
    </script>

</body>
</html>
