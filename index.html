<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentCar - Bienvenido</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff; /* Mismo fondo gris que tu formulario */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Enlace gigante que cubre el 100% de la pantalla */
        .splash-link {
            text-decoration: none;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Texto central con la marca RentCar */
        .brand-text {
            font-family: 'Bangers', cursive;
            font-size: 100px; /* Tamaño grande e imponente en el centro */
            color: #df0000; /* Rojo exacto solicitado */
            font-style: italic;
            letter-spacing: 2px;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.2s ease-in-out;
            
            /* Sombra sutil para darle volumen */
            text-shadow: 3px 3px 0px #000000;
        }

        /* Modificador específico para la letra T en negro */
        .t-black {
            color: #000000;
            text-shadow: 3px 3px 0px #ffffff; /* Sombra blanca para resaltar sobre el fondo gris */
            border-color: #ffffff;
        }

        /* Efecto visual al pasar el mouse por cualquier lado de la pantalla */
        .splash-link:hover .brand-text {
            transform: scale(1.05); /* El texto crece un poco indicando interactividad */
        }

        /* Responsivo para pantallas de celulares */
        @media (max-width: 768px) {
            .brand-text {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

    <a href="antesdellogin.html" class="splash-link">
        <h1 class="brand-text">
            REN<span class="t-black">T</span>CAR
        </h1>
    </a>

</body>
</html>
